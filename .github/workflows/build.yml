name: Build and package HealTouch

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']

# Verify jobs need only repository reads. The Release job receives write access separately.
permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Liberica Java 8 with JavaFX
        uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: '8'
          java-package: jdk+fx
          architecture: x64
          cache: maven
      - name: Verify Java 8 and JavaFX toolchain
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "JAVA_HOME=$env:JAVA_HOME"
          & java -version
          $javaFxRuntime = Join-Path $env:JAVA_HOME 'jre\lib\ext\jfxrt.jar'
          if (-not (Test-Path -LiteralPath $javaFxRuntime -PathType Leaf)) {
            throw "The configured JDK is missing the JavaFX 8 runtime: $javaFxRuntime"
          }
          & javap javafx.application.Application | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'JavaFX 8 is present on disk but cannot be loaded by the configured JDK.' }
      - name: Verify runner Maven version
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Do not pipe the native Maven process to Select-Object -First 1.  That command
          # closes the pipe after the first line and can make Maven/Java exit with code 1.
          $mavenOutput = @(& mvn --version 2>&1)
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            throw "Maven version command failed with exit code ${exitCode}:`n$($mavenOutput -join [Environment]::NewLine)"
          }
          $actualVersion = [string]$mavenOutput[0]
          if ($actualVersion -notmatch 'Apache Maven 3\.') { throw "Expected Apache Maven 3.x, but found: $actualVersion" }
          Write-Host $mavenOutput
      - name: Resolve Maven dependencies and build plugins
        run: mvn --batch-mode --errors dependency:go-offline
      - name: Compile, migrate and test
        run: mvn --batch-mode --errors clean verify

  package:
    # Every push to main creates testable Windows installers after the verification job.
    # Pull requests run verification only and never generate release artifacts.
    needs: verify
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: '8'
          java-package: jdk+fx
          architecture: x64
          cache: maven
      - name: Remember x64 JavaFX JDK for packaging
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:JAVA_HOME)) { throw 'actions/setup-java did not set JAVA_HOME for the x64 JDK.' }
          "HEALTOUCH_JDK_X64=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "x64 JDK=$env:JAVA_HOME"
      - name: Install and verify Windows packagers
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Chocolatey currently publishes Launch4j 3.14; version 3.50 does not exist in
          # the configured Chocolatey source.  Allow a downgrade if a future runner image
          # happens to preinstall a newer copy so this workflow remains deterministic.
          & choco install launch4j --version=3.14 --allow-downgrade --no-progress --yes
          if ($LASTEXITCODE -ne 0) { throw "Launch4j installation failed with exit code $LASTEXITCODE." }

          # Inno Setup is preinstalled on the GitHub Windows image.  Only bootstrap it when
          # a future image removes it; do not force a downgrade of the runner-provided copy.
          if ($null -eq (Get-Command iscc -ErrorAction SilentlyContinue)) {
            & choco install innosetup --no-progress --yes
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed with exit code $LASTEXITCODE." }
          }

          # The Chocolatey package installs Launch4j with its own installer, which does
          # not create a Chocolatey shim or update PATH in the current process.  Resolve the
          # executable explicitly and pass it to later packaging steps through GITHUB_ENV.
          $launch4jcCandidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Launch4j\launch4jc.exe'),
            (Join-Path $env:ProgramFiles 'Launch4j\launch4jc.exe')
          )
          $launch4jcPath = $launch4jcCandidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($launch4jcPath)) {
            throw "Launch4j was installed but launch4jc.exe was not found. Checked: $($launch4jcCandidates -join '; ')"
          }
          "HEALTOUCH_LAUNCH4JC=$launch4jcPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "launch4jc=$launch4jcPath"

          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if ($null -eq $iscc) { throw 'Required packager command was not found: iscc' }
          Write-Host "iscc=$($iscc.Source)"
      - name: Verify Java 8 and JavaFX toolchain
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "JAVA_HOME=$env:JAVA_HOME"
          & java -version
          $javaFxRuntime = Join-Path $env:JAVA_HOME 'jre\lib\ext\jfxrt.jar'
          if (-not (Test-Path -LiteralPath $javaFxRuntime -PathType Leaf)) {
            throw "The configured JDK is missing the JavaFX 8 runtime: $javaFxRuntime"
          }
          & javap javafx.application.Application | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'JavaFX 8 is present on disk but cannot be loaded by the configured JDK.' }
      - name: Verify runner Maven version
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Do not pipe the native Maven process to Select-Object -First 1.  That command
          # closes the pipe after the first line and can make Maven/Java exit with code 1.
          $mavenOutput = @(& mvn --version 2>&1)
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            throw "Maven version command failed with exit code ${exitCode}:`n$($mavenOutput -join [Environment]::NewLine)"
          }
          $actualVersion = [string]$mavenOutput[0]
          if ($actualVersion -notmatch 'Apache Maven 3\.') { throw "Expected Apache Maven 3.x, but found: $actualVersion" }
          Write-Host $mavenOutput
      - name: Resolve Maven dependencies and build plugins
        run: mvn --batch-mode --errors dependency:go-offline
      - name: Prepare installer version
        shell: powershell
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}'.TrimStart('v')
          } else {
            # Inno Setup accepts a four-part numeric version. This identifies a main-branch CI build.
            $version = '0.0.0.${{ github.run_number }}'
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build application
        run: mvn --batch-mode --errors clean package -DskipTests
      - name: Set up Liberica Java 8 with JavaFX for x86 runtime
        uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: '8'
          java-package: jdk+fx
          architecture: x86
      - name: Prepare and verify bundled JavaFX 8 runtimes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $runtimes = @(
            @{ Architecture = 'x86'; JdkHome = $env:JAVA_HOME; ExpectedBits = '32' },
            @{ Architecture = 'x64'; JdkHome = $env:HEALTOUCH_JDK_X64; ExpectedBits = '64' }
          )
          foreach ($runtime in $runtimes) {
            if ([string]::IsNullOrWhiteSpace($runtime.JdkHome)) {
              throw "The $($runtime.Architecture) JavaFX JDK location is missing."
            }
            $runtimeHome = Join-Path $runtime.JdkHome 'jre'
            $java = Join-Path $runtimeHome 'bin\java.exe'
            $javaFx = Join-Path $runtimeHome 'lib\ext\jfxrt.jar'
            if (-not (Test-Path -LiteralPath $java -PathType Leaf)) {
              throw "The $($runtime.Architecture) JDK does not contain the expected bundled runtime: $java"
            }
            if (-not (Test-Path -LiteralPath $javaFx -PathType Leaf)) {
              throw "The $($runtime.Architecture) bundled runtime does not contain JavaFX 8: $javaFx"
            }
            $properties = @(& $java -XshowSettings:properties -version 2>&1)
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to start the $($runtime.Architecture) bundled runtime: $($properties -join [Environment]::NewLine)"
            }
            $bitnessPattern = "(?m)^\s*sun\.arch\.data\.model\s*=\s*$($runtime.ExpectedBits)\s*$"
            if (($properties -join [Environment]::NewLine) -notmatch $bitnessPattern) {
              throw "The JDK selected for $($runtime.Architecture) did not report $($runtime.ExpectedBits)-bit Java."
            }
            $destination = Join-Path 'runtime' $runtime.Architecture
            New-Item -ItemType Directory -Path $destination -Force | Out-Null
            Copy-Item -Path (Join-Path $runtimeHome '*') -Destination $destination -Recurse -Force
            Write-Host "Prepared $($runtime.Architecture) JavaFX runtime from $runtimeHome"
          }
      - name: Build x86 installer
        shell: powershell
        run: .\packaging\build-installer.ps1 -Architecture x86 -Version $env:VERSION -RuntimeDirectory runtime\x86
      - name: Build x64 installer
        shell: powershell
        run: .\packaging\build-installer.ps1 -Architecture x64 -Version $env:VERSION -RuntimeDirectory runtime\x64
      - name: Create SHA-256 sums and verify package outputs
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = Get-ChildItem target\installer\HealTouch-*-Setup.exe
          if ($packages.Count -ne 2) { throw "Expected 2 installers, but found $($packages.Count)." }
          $packages | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } |
            Set-Content target\installer\SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: HealTouch-${{ github.ref_name }}-${{ github.sha }}
          path: target/installer/*
          if-no-files-found: error

  release:
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HealTouch-${{ github.ref_name }}-${{ github.sha }}
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
