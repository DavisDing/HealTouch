name: Build and release HealTouch

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version increment for a manual release'
        required: true
        default: minor
        type: choice
        options:
          - minor
          - major

# Verification and packaging need only repository reads. The Release job receives write access separately.
permissions:
  contents: read

# Release runs must calculate and reserve versions one at a time so concurrent pushes cannot reuse a tag.
concurrency:
  group: healtouch-main-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Liberica Java 8 with JavaFX
        uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: '8'
          java-package: jdk+fx
          architecture: x64
          cache: maven
      - name: Verify Java 8 and JavaFX toolchain
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "JAVA_HOME=$env:JAVA_HOME"
          & java -version
          $javaFxRuntime = Join-Path $env:JAVA_HOME 'jre\lib\ext\jfxrt.jar'
          if (-not (Test-Path -LiteralPath $javaFxRuntime -PathType Leaf)) {
            throw "The configured JDK is missing the JavaFX 8 runtime: $javaFxRuntime"
          }
          & javap javafx.application.Application | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'JavaFX 8 is present on disk but cannot be loaded by the configured JDK.' }
      - name: Verify runner Maven version
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Do not pipe the native Maven process to Select-Object -First 1.  That command
          # closes the pipe after the first line and can make Maven/Java exit with code 1.
          $mavenOutput = @(& mvn --version 2>&1)
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            throw "Maven version command failed with exit code ${exitCode}:`n$($mavenOutput -join [Environment]::NewLine)"
          }
          $actualVersion = [string]$mavenOutput[0]
          if ($actualVersion -notmatch 'Apache Maven 3\.') { throw "Expected Apache Maven 3.x, but found: $actualVersion" }
          Write-Host $mavenOutput
      - name: Resolve Maven dependencies and build plugins
        run: mvn --batch-mode --errors dependency:go-offline
      - name: Compile, migrate and test
        run: mvn --batch-mode --errors clean verify

  version:
    # Only commits on main may create a release. workflow_dispatch is the manual major-release entry point.
    needs: verify
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next-version.outputs.version }}
      tag: ${{ steps.next-version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: next-version
        name: Calculate next release version
        shell: bash
        env:
          VERSION_BUMP: ${{ inputs.version_bump || 'minor' }}
        run: |
          set -euo pipefail
          git fetch --force --tags

          case "$VERSION_BUMP" in
            minor|major) ;;
            *) echo "Unsupported version bump: $VERSION_BUMP" >&2; exit 1 ;;
          esac

          # Only stable vMAJOR.MINOR.PATCH tags participate in automatic versioning.
          latest="$({ git tag --list | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ { sub(/^v/, ""); print }'; } | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)"
          if [[ -z "$latest" ]]; then
            # The first release establishes the 1.x line, matching the project version baseline.
            version='1.0.0'
          else
            IFS='.' read -r major minor patch <<< "$latest"
            major=$((10#$major))
            minor=$((10#$minor))
            patch=$((10#$patch))
            if [[ "$VERSION_BUMP" == 'major' ]]; then
              version="$((major + 1)).0.0"
            else
              version="${major}.$((minor + 1)).0"
            fi
          fi

          tag="v$version"
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            echo "Release tag already exists: $tag" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Preparing release $tag from $GITHUB_SHA"

  package:
    # Pull requests verify only. Every successful main push produces a versioned release package.
    needs: [verify, version]
    if: needs.verify.result == 'success' && needs.version.result == 'success'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: '8'
          java-package: jdk+fx
          architecture: x64
          cache: maven
      - name: Remember x64 JavaFX JDK for packaging
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:JAVA_HOME)) { throw 'actions/setup-java did not set JAVA_HOME for the x64 JDK.' }
          "HEALTOUCH_JDK_X64=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "x64 JDK=$env:JAVA_HOME"
      - name: Install and verify Windows packagers
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Chocolatey currently publishes Launch4j 3.14; version 3.50 does not exist in
          # the configured Chocolatey source.  Allow a downgrade if a future runner image
          # happens to preinstall a newer copy so this workflow remains deterministic.
          & choco install launch4j --version=3.14 --allow-downgrade --no-progress --yes
          if ($LASTEXITCODE -ne 0) { throw "Launch4j installation failed with exit code $LASTEXITCODE." }

          # Inno Setup is preinstalled on the GitHub Windows image.  Only bootstrap it when
          # a future image removes it; do not force a downgrade of the runner-provided copy.
          if ($null -eq (Get-Command iscc -ErrorAction SilentlyContinue)) {
            & choco install innosetup --no-progress --yes
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed with exit code $LASTEXITCODE." }
          }

          # The Chocolatey package installs Launch4j with its own installer, which does
          # not create a Chocolatey shim or update PATH in the current process.  More
          # importantly, the native launch4jc.exe launcher discovers Java through legacy
          # Windows installation locations and can fail even after actions/setup-java has
          # configured JAVA_HOME.  Resolve launch4j.jar instead; build-installer.ps1 runs it
          # explicitly with the Java 8 executable supplied by the workflow.
          $launch4jJarCandidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Launch4j\launch4j.jar'),
            (Join-Path $env:ProgramFiles 'Launch4j\launch4j.jar')
          )
          $launch4jJarPath = $launch4jJarCandidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($launch4jJarPath)) {
            throw "Launch4j was installed but launch4j.jar was not found. Checked: $($launch4jJarCandidates -join '; ')"
          }
          "HEALTOUCH_LAUNCH4J_JAR=$launch4jJarPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "launch4j.jar=$launch4jJarPath"

          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if ($null -eq $iscc) { throw 'Required packager command was not found: iscc' }
          Write-Host "iscc=$($iscc.Source)"
      - name: Verify Java 8 and JavaFX toolchain
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "JAVA_HOME=$env:JAVA_HOME"
          & java -version
          $javaFxRuntime = Join-Path $env:JAVA_HOME 'jre\lib\ext\jfxrt.jar'
          if (-not (Test-Path -LiteralPath $javaFxRuntime -PathType Leaf)) {
            throw "The configured JDK is missing the JavaFX 8 runtime: $javaFxRuntime"
          }
          & javap javafx.application.Application | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'JavaFX 8 is present on disk but cannot be loaded by the configured JDK.' }
      - name: Verify runner Maven version
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Do not pipe the native Maven process to Select-Object -First 1.  That command
          # closes the pipe after the first line and can make Maven/Java exit with code 1.
          $mavenOutput = @(& mvn --version 2>&1)
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            throw "Maven version command failed with exit code ${exitCode}:`n$($mavenOutput -join [Environment]::NewLine)"
          }
          $actualVersion = [string]$mavenOutput[0]
          if ($actualVersion -notmatch 'Apache Maven 3\.') { throw "Expected Apache Maven 3.x, but found: $actualVersion" }
          Write-Host $mavenOutput
      - name: Resolve Maven dependencies and build plugins
        run: mvn --batch-mode --errors dependency:go-offline
      - name: Prepare installer version
        shell: powershell
        run: |
          $version = '${{ needs.version.outputs.version }}'
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build application
        run: mvn --batch-mode --errors clean package -DskipTests
      - name: Set up Liberica Java 8 with JavaFX for x86 runtime
        uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: '8'
          java-package: jdk+fx
          architecture: x86
      - name: Prepare and verify bundled JavaFX 8 runtimes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $runtimes = @(
            @{ Architecture = 'x86'; JdkHome = $env:JAVA_HOME; ExpectedBits = '32' },
            @{ Architecture = 'x64'; JdkHome = $env:HEALTOUCH_JDK_X64; ExpectedBits = '64' }
          )
          foreach ($runtime in $runtimes) {
            if ([string]::IsNullOrWhiteSpace($runtime.JdkHome)) {
              throw "The $($runtime.Architecture) JavaFX JDK location is missing."
            }
            $runtimeHome = Join-Path $runtime.JdkHome 'jre'
            $java = Join-Path $runtimeHome 'bin\java.exe'
            $javaFx = Join-Path $runtimeHome 'lib\ext\jfxrt.jar'
            if (-not (Test-Path -LiteralPath $java -PathType Leaf)) {
              throw "The $($runtime.Architecture) JDK does not contain the expected bundled runtime: $java"
            }
            if (-not (Test-Path -LiteralPath $javaFx -PathType Leaf)) {
              throw "The $($runtime.Architecture) bundled runtime does not contain JavaFX 8: $javaFx"
            }
            # java -XshowSettings writes property settings to stderr.  Do not use PowerShell
            # 2>&1 here: with ErrorActionPreference=Stop, stderr is promoted to a terminating
            # NativeCommandError even when java exits successfully.  Capture both streams via
            # ProcessStartInfo instead.
            $startInfo = New-Object System.Diagnostics.ProcessStartInfo
            $startInfo.FileName = $java
            $startInfo.Arguments = '-XshowSettings:properties -version'
            $startInfo.UseShellExecute = $false
            $startInfo.RedirectStandardOutput = $true
            $startInfo.RedirectStandardError = $true
            $process = New-Object System.Diagnostics.Process
            $process.StartInfo = $startInfo
            [void]$process.Start()
            # Drain stdout and stderr concurrently. Reading stdout to completion before stderr
            # can deadlock when Java fills its stderr pipe with -XshowSettings output.
            $standardOutputTask = $process.StandardOutput.ReadToEndAsync()
            $standardErrorTask = $process.StandardError.ReadToEndAsync()
            if (-not $process.WaitForExit(60000)) {
              $process.Kill()
              $process.WaitForExit()
              throw "Timed out after 60 seconds while starting the $($runtime.Architecture) bundled runtime."
            }
            $standardOutput = $standardOutputTask.GetAwaiter().GetResult()
            $standardError = $standardErrorTask.GetAwaiter().GetResult()
            $properties = $standardOutput + [Environment]::NewLine + $standardError
            if ($process.ExitCode -ne 0) {
              throw "Unable to start the $($runtime.Architecture) bundled runtime: $properties"
            }
            $bitnessPattern = "(?m)^\s*sun\.arch\.data\.model\s*=\s*$($runtime.ExpectedBits)\s*$"
            if ($properties -notmatch $bitnessPattern) {
              throw "The JDK selected for $($runtime.Architecture) did not report $($runtime.ExpectedBits)-bit Java."
            }
            $destination = Join-Path 'runtime' $runtime.Architecture
            New-Item -ItemType Directory -Path $destination -Force | Out-Null
            Copy-Item -Path (Join-Path $runtimeHome '*') -Destination $destination -Recurse -Force
            Write-Host "Prepared $($runtime.Architecture) JavaFX runtime from $runtimeHome"
          }
      - name: Build x86 installer
        shell: powershell
        run: .\packaging\build-installer.ps1 -Architecture x86 -Version $env:VERSION -RuntimeDirectory runtime\x86
      - name: Build x64 installer
        shell: powershell
        run: .\packaging\build-installer.ps1 -Architecture x64 -Version $env:VERSION -RuntimeDirectory runtime\x64
      - name: Create SHA-256 sums and verify package outputs
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = Get-ChildItem target\installer\HealTouch-*-Setup.exe
          if ($packages.Count -ne 2) { throw "Expected 2 installers, but found $($packages.Count)." }
          $packages | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } |
            Set-Content target\installer\SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: HealTouch-${{ needs.version.outputs.tag }}-${{ github.sha }}
          path: target/installer/*
          if-no-files-found: error

  release:
    # A tag and GitHub Release are created only after both installers and checksums exist.
    needs: [package, version]
    if: needs.package.result == 'success' && needs.version.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HealTouch-${{ needs.version.outputs.tag }}-${{ github.sha }}
          path: release-assets
      - name: Create GitHub Release and tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: HealTouch ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
