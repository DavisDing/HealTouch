          <text x="160" y="222" class="font-sans" font-size="11" fill="#718E9E" text-anchor="middle">10-13 周二</text>
          <text x="240" y="222" class="font-sans" font-size="11" fill="#718E9E" text-anchor="middle">10-14 周三</text>
