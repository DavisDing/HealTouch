    <circle cx="20" cy="20" r="10" fill="#F2F6F8"/>
    <text x="20" y="24" class="font-sans" font-size="10" font-weight="700" fill="#829BA8" text-anchor="middle">04</text>
    <text x="40" y="25" class="font-sans" font-size="14" font-weight="500" fill="#415E70">账单与收费</text>
