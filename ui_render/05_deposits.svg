    <text x="46" y="22" class="font-sans" font-size="18" font-weight="700" fill="#13334A">HealTouch</text>
    <text x="142" y="22" class="font-sans" font-size="12" font-weight="500" fill="#087F6D" letter-spacing="1">门诊专业版 V2.4</text>
