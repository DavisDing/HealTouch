      <rect x="800" y="79" width="48" height="20" rx="4" fill="#DCFCE7"/>
      <text x="812" y="93" class="font-sans" font-size="11" font-weight="700" fill="#15803D">启用中</text>
      <g transform="translate(960, 78)">
